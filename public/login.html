<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Table Sense — Sign in</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#17171C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#17171C;
    --panel:#232329;
    --ink:#EAEAEE;
    --ink-soft:#A8A8B4;
    --line:#38383F;
    --green:#6BDB1A;
    --red:#FF6161;
    --red-bg:#3D1616;
    --display:'Baloo 2','Nunito',system-ui,sans-serif;
    --body:'Nunito',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--body);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .card{
    width:100%; max-width:360px;
    background:var(--panel); border:2px solid var(--line); border-bottom:4px solid var(--line);
    border-radius:20px; padding:28px 24px;
  }
  h1{
    font-family:var(--display); font-size:1.4rem; font-weight:800; margin:0 0 4px;
    display:flex; align-items:center; gap:8px;
  }
  h1 .suit{color:var(--red);}
  p.sub{color:var(--ink-soft); font-weight:700; font-size:0.78rem; margin:0 0 22px; text-transform:uppercase; letter-spacing:0.04em;}
  label{display:block; font-weight:700; font-size:0.8rem; color:var(--ink-soft); margin-bottom:8px;}
  input[type="password"]{
    width:100%; padding:13px 14px; border-radius:12px; border:2px solid var(--line);
    background:#1C1C22; color:var(--ink); font-size:1rem; font-family:var(--body); font-weight:700;
    margin-bottom:14px;
  }
  input[type="password"]:focus{outline:none; border-color:var(--green);}
  button{
    width:100%; padding:13px; border-radius:14px; border:none; border-bottom:4px solid #2F7A00;
    background:var(--green); color:#0E2600; font-family:var(--display); font-weight:800; font-size:0.95rem;
    cursor:pointer;
  }
  button:active{transform:translateY(2px); border-bottom-width:2px;}
  button:disabled{opacity:0.6; cursor:default;}
  .error{
    background:var(--red-bg); border:2px solid var(--red); color:var(--red);
    border-radius:10px; padding:9px 11px; font-size:0.8rem; font-weight:700;
    margin-bottom:14px; display:none;
  }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="suit">♠</span> Table Sense</h1>
    <p class="sub">Enter password to continue</p>
    <div class="error" id="err"></div>
    <form id="loginForm">
      <label for="pw">Password</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus required>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const err = document.getElementById('err');
  const btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Checking…';
    const password = document.getElementById('pw').value;
    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({password})
      });
      if(res.ok){
        window.location.href = '/';
      } else {
        const body = await res.json().catch(()=>({}));
        let msg = body.error || 'Incorrect password.';
        if(body.debug && body.debug.hint){
          msg += ' (' + body.debug.hint + ' You typed ' + body.debug.youTypedLength + ' characters; the server expects ' + body.debug.serverExpectsLength + '.)';
        }
        err.textContent = msg;
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    } catch(e){
      err.textContent = 'Could not reach the server. Try again.';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
